# Publishes the AR pages (speech-notes/src/ar) to GitHub Pages so WebXR runs over HTTPS.
# One-time setup: GitHub -> Settings -> Pages -> Source: "GitHub Actions".
# URL: https://coolysn.github.io/Mobiilirakenduste_arendamine/webxr-ar.html
name: AR pages

on:
  push:
    branches: [main]
    paths: ['speech-notes/src/ar/**', '.github/workflows/ar-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: speech-notes/src/ar
      - id: deployment
        uses: actions/deploy-pages@v4
