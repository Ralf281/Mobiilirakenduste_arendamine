<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marker AR sticky note</title>
    <!-- Vana versioon laadis AR.js-i aadressilt cdn.rawgit.com, mis suleti 2019. Nüüd: A-Frame 1.6 + AR.js 3.4 -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #hint { position: fixed; z-index: 10; left: 12px; right: 12px; bottom: 12px; padding: 10px 12px; border-radius: 12px; background: #fffe; font: 14px system-ui, sans-serif; color: #222; }
    </style>
</head>
<body>
    <div id="hint">Näita kaamerale Hiro-markerit. Markerile ilmub esimene märge äpist.</div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-marker preset="hiro">
            <!-- märge lamab markeril, kergelt viltu -->
            <a-entity rotation="-90 0 4">
                <!-- tekst joonistatakse canvasele, sest A-Frame'i vaikefont ei sisalda õ, ä, ö, ü tähti -->
                <a-plane id="note" width="1" height="1" color="#ffffff" side="double"></a-plane>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Sama ?notes=["..."] parameeter nagu WebXR lehel
        let text = 'Osta piima';
        try {
            const list = JSON.parse(new URLSearchParams(location.search).get('notes') || '[]');
            if (Array.isArray(list) && list[0]) text = String(list[0]).slice(0, 80);
        } catch (e) { /* jääb näidistekst */ }

        const c = document.createElement('canvas');
        c.width = c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffe873'; ctx.fillRect(0, 0, 512, 512);
        ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(0, 0, 512, 70);
        ctx.fillStyle = '#2a2a2a';
        ctx.font = '600 64px "Segoe Print", "Comic Sans MS", system-ui, sans-serif';
        const words = text.split(/\s+/), lines = [];
        let line = '';
        for (const w of words) {
            const t = line ? line + ' ' + w : w;
            if (ctx.measureText(t).width > 420 && line) { lines.push(line); line = w; } else line = t;
        }
        if (line) lines.push(line);
        let y = 70 + (442 - lines.length * 80) / 2 + 56;
        for (const l of lines.slice(0, 5)) { ctx.fillText(l, 46, y); y += 80; }

        const note = document.querySelector('#note');
        const apply = () => {
            const mesh = note.getObject3D('mesh');
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            mesh.material.map = tex;
            mesh.material.needsUpdate = true;
        };
        if (window.AFRAME) {
            if (note.getObject3D('mesh')) apply(); else note.addEventListener('loaded', apply);
        } else {
            document.querySelector('#hint').textContent = 'A-Frame/AR.js ei laadinud (internetiühendus?).';
        }
    </script>
</body>
</html>
